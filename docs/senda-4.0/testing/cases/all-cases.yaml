# Structured lock scenarios — Senda 4.0
# Schema: ./schema.yaml | Fixtures: ../fixtures/pilot-zw.yaml
version: 1
fixture_file: ../fixtures/pilot-zw.yaml

cases:
  # ── Lock #1 Dogfood ───────────────────────────────────────────
  - id: DF-01
    title: Dogfood happy path without live MTO
    domain: Surface
    locks: ["1", "10"]
    type: happy
    fixtures: [institution, links, obligations, dogfood]
    steps:
      - load fixture pilot-zw
      - dogfood.validate link_code=HDA-ADA-001 obligation_id=obl_001
      - dogfood.instruct idempotency_key=df-01
      - dogfood.confirm matching ref+amount+currency
      - dogfood.fetch_proof
    expect:
      status: proven
      proof: true
      live_mto_required: false
    pass_criteria: Full validate→instruct→confirm→proof completes in dogfood; proof JSON available.

  - id: DF-02
    title: Dogfood shares Connect domain objects
    domain: Attempt
    locks: ["1", "9"]
    type: edge
    fixtures: [dogfood]
    steps:
      - inspect Attempt/Instruction/Confirmation/Proof created via dogfood
      - compare schema to Connect contract
    expect:
      status: policy_ok
      same_schema_as_connect: true
    pass_criteria: Dogfood writes the same domain objects Connect would.

  - id: DF-03
    title: Dogfood stays thin (no consumer remittance UI)
    domain: Surface
    locks: ["1"]
    type: policy
    fixtures: [dogfood]
    steps:
      - inventory dogfood screens/routes
    expect:
      status: policy_ok
      forbidden_features: [fx_rates_ui, multi_recipient_consumer, senda_settles]
    pass_criteria: Only instruct/confirm/proof (and minimal ops); no consumer remittance product.

  - id: DF-04
    title: Dogfood cannot become senda_settles
    domain: Surface
    locks: ["1", "10"]
    type: abuse
    fixtures: [dogfood]
    steps:
      - attempt dogfood action collect_fx_payout
    expect:
      status: reject
      error_code: senda_settles_forbidden
    pass_criteria: Reject adaptor-as-payer via dogfood.

  - id: DF-05
    title: Cold-start uses dogfood when no named partner
    domain: Surface
    locks: ["1", "4"]
    type: edge
    fixtures: [dogfood]
    steps:
      - assert no named design partner required
      - run DF-01 loop
    expect:
      status: allow
    pass_criteria: Build/test loop unblocked without live MTO (#4).

  # ── Lock #2 Links ─────────────────────────────────────────────
  - id: LK-01
    title: Open Link validate without payer binding
    domain: Link
    locks: ["2"]
    type: happy
    fixtures: [links, obligations]
    steps:
      - connect.validate link_code=HDA-ADA-001 obligation_id=obl_001 payer_hint=null
    expect:
      status: allow
    pass_criteria: Validate succeeds for open student+school Link.

  - id: LK-02
    title: Two payers can use same open Link
    domain: Link
    locks: ["2"]
    type: happy
    fixtures: [links, obligations]
    steps:
      - connect.validate as payer_A on link_001
      - connect.validate as payer_B on link_001
    expect:
      status: allow
      payer_bound: false
    pass_criteria: Not payer-bound day one.

  - id: LK-03
    title: Confirm verifies ref+amount+currency
    domain: Confirmation
    locks: ["2", "10"]
    type: happy
    fixtures: [links, obligations, partners.mukuru_sandbox]
    steps:
      - instruct then confirm with exact match
    expect:
      status: proven
    pass_criteria: Verification on confirm required and passes.

  - id: LK-04
    title: Wrong obligation for Link rejected
    domain: Obligation
    locks: ["2"]
    type: edge
    fixtures: [links, obligations]
    steps:
      - validate link_001 with obligation belonging to other beneficiary
    expect:
      status: reject
      error_code: obligation_link_mismatch
    pass_criteria: Obligation must belong to Link/beneficiary.

  - id: LK-05
    title: Unknown link_code rejected
    domain: Link
    locks: ["2"]
    type: edge
    fixtures: [links]
    steps:
      - validate link_code=UNKNOWN
    expect:
      status: reject
      error_code: link_not_found
    pass_criteria: Link must resolve.

  - id: LK-06
    title: Confirm without Instruction rejected
    domain: Confirmation
    locks: ["2"]
    type: abuse
    fixtures: [links]
    steps:
      - confirm attempt_id missing or never instructed
    expect:
      status: reject
      error_code: attempt_not_instructed
    pass_criteria: No confirm/proof without instruct→ref.

  - id: LK-07
    title: Confirm wrong amount → needs_reconcile
    domain: Confirmation
    locks: ["2", disputes]
    type: edge
    fixtures: [partners.mukuru_sandbox]
    steps:
      - instruct amount=850
      - confirm amount=800
    expect:
      status: needs_reconcile
    pass_criteria: Exact amount match MVP fails → recon.

  - id: LK-08
    title: Confirm wrong currency → needs_reconcile
    domain: Confirmation
    locks: ["2", disputes]
    type: edge
    fixtures: [partners.mukuru_sandbox]
    steps:
      - instruct currency=USD
      - confirm currency=ZiG
    expect:
      status: needs_reconcile
    pass_criteria: Currency mismatch → recon.

  - id: LK-09
    title: Confirm wrong customer_reference → needs_reconcile
    domain: Confirmation
    locks: ["2", disputes]
    type: edge
    fixtures: [partners.mukuru_sandbox]
    steps:
      - instruct
      - confirm with altered customer_reference
    expect:
      status: needs_reconcile
    pass_criteria: Ref check fails → recon.

  - id: LK-10
    title: Payer-bound Links not required day one
    domain: Link
    locks: ["2"]
    type: policy
    fixtures: [links]
    steps:
      - design review of Link model
    expect:
      status: policy_ok
      binding: open_student_school
    pass_criteria: Lock #2 open first; bind later.

