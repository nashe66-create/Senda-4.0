# Schema for docs/senda-4.0/testing/cases/*.yaml
# validate_pack.py enforces required fields.

version: 1
required_case_fields:
  - id
  - title
  - domain
  - locks
  - type
  - fixtures
  - steps
  - expect
  - pass_criteria

enums:
  domain:
    - Institution
    - SettleDestination
    - Beneficiary
    - Link
    - Obligation
    - Attempt
    - Instruction
    - Confirmation
    - Proof
    - Surface
    - Policy
    - Partner
    - Docs
  type:
    - happy
    - edge
    - abuse
    - ops
    - partner
    - dispute
    - policy
  expect.status:
    - allow
    - reject
    - proven
    - needs_reconcile
    - deferred
    - docs_ok
    - policy_ok
    - stuck_instructed
    - idempotent

locks_allowed:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  - "6-8"
  - "9"
  - "10"
  - wedge
  - freshness
  - scope
  - disputes
